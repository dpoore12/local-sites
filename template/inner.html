{% extends "base.html" %}
{% block content %}

<section class="hero" style="padding-block:3.5rem 2.5rem">
  <div class="wrap">
    <span class="eyebrow">{{ icon_pin }}{{ s.city }}, {{ s.state }}</span>
    <h1 style="font-size:clamp(1.9rem,4vw,2.7rem)">{{ h1 }}</h1>
    <div class="cta-row">
      <a class="btn-call" href="tel:{{ s.phone_tel }}">{{ icon_phone }}Call {{ s.phone_display }}</a>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <div class="prose">{{ body | safe }}</div>
  </div>
</section>

{% endblock %}
