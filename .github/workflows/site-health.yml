# Synthetic monitor — catches the Sep 6 failure mode (home 200, interiors 404)
# and the Location-leak regression (Aug 24–Sep 7). Does NOT rebuild or redeploy.
name: site-health

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "host_all.py"
      - "router/_worker.js"
      - "test_unprefix.py"
      - ".github/workflows/site-health.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unprefix Location-leak unit tests
        run: python3 test_unprefix.py

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe every market (home + interiors + Location leak)
        run: python3 host_all.py check
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-check
          path: data/hosting.json
          if-no-files-found: ignore
